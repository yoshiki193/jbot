services:
  jbot:
    build:
      context: .
      dockerfile: dev.Dockerfile
    tty: true
    environment:
      API_TOKEN: ${API_TOKEN}
      CLAUDE_CONFIG_DIR: /root/.claude
    volumes:
      - ./src:/app
      - claude-code-config:/root/.claude

  voicevox-engine:
    image: voicevox/voicevox_engine:nvidia-0.26.0-dev
    container_name: voicevox-engine
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  claude-code-config: